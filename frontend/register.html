<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | ESTORA Luxury Real Estate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ballet&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/theme.js"></script>
</head>
<body style="background: var(--background);">

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="nav-brand">
        <span class="logo-icon"><i class="fa-solid fa-gem"></i></span>
        ESTORA
      </a>

      <ul class="nav-menu">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/properties.html" class="nav-link">Properties</a></li>
        <li><a href="/agents.html" class="nav-link">Agents</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width:540px;">
      <div class="auth-header">
        <span class="section-subtitle">JOIN THE ROSTER</span>
        <h1 class="auth-title">Create <span class="script-accent">Account</span></h1>
        <p class="auth-subtitle">Register to save bespoke properties or manage estate listings</p>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <!-- Account Type Selector -->
        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label">Register As</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
            <label style="border:1px solid var(--primary); padding:0.85rem 1rem; border-radius:var(--radius-xs); cursor:pointer; display:flex; align-items:center; gap:0.6rem; background:var(--surface-alt);" id="user-radio-box">
              <input type="radio" name="account-role" value="USER" checked onchange="toggleAgentFields(this.value)" style="accent-color:var(--primary);">
              <span style="font-weight:600; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text);">Buyer / Tenant</span>
            </label>
            <label style="border:1px solid var(--border); padding:0.85rem 1rem; border-radius:var(--radius-xs); cursor:pointer; display:flex; align-items:center; gap:0.6rem;" id="agent-radio-box">
              <input type="radio" name="account-role" value="AGENT" onchange="toggleAgentFields(this.value)" style="accent-color:var(--primary);">
              <span style="font-weight:600; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted);" id="agent-radio-label">Estate Advisor</span>
            </label>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:1.25rem;">
          <label class="form-label">Full Legal Name</label>
          <input type="text" id="reg-name" class="form-control" required placeholder="e.g. Vikram Malhotra">
        </div>

        <div class="form-group" style="margin-bottom:1.25rem;">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" required placeholder="name@domain.com">
        </div>

        <div class="form-group" style="margin-bottom:1.25rem;">
          <label class="form-label">Phone Contact</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98200 12345">
        </div>

        <!-- Optional Agency Field for Agents -->
        <div class="form-group" id="agency-field-group" style="margin-bottom:1.25rem; display:none;">
          <label class="form-label">Agency / Brokerage Name</label>
          <input type="text" id="reg-agency" class="form-control" placeholder="e.g. Apex Luxury Living">
        </div>

        <div class="form-group" style="margin-bottom:1.75rem;">
          <label class="form-label">Security Password (min. 6 characters)</label>
          <input type="password" id="reg-password" class="form-control" required minlength="6" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-submit-btn">
          Create Estora Account
        </button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; font-size:12px; color:var(--text-muted);">
        Already have an account? <a href="/login.html" style="color:var(--text); font-weight:600; text-decoration:underline;">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function toggleAgentFields(role) {
      const agencyGroup = document.getElementById('agency-field-group');
      const userBox = document.getElementById('user-radio-box');
      const agentBox = document.getElementById('agent-radio-box');
      const agentLabel = document.getElementById('agent-radio-label');

      if (role === 'AGENT') {
        agencyGroup.style.display = 'block';
        agentBox.style.borderColor = 'var(--primary)';
        agentBox.style.background = 'var(--surface-alt)';
        agentLabel.style.color = 'var(--text)';
        userBox.style.borderColor = 'var(--border)';
        userBox.style.background = 'transparent';
      } else {
        agencyGroup.style.display = 'none';
        userBox.style.borderColor = 'var(--primary)';
        userBox.style.background = 'var(--surface-alt)';
        agentBox.style.borderColor = 'var(--border)';
        agentBox.style.background = 'transparent';
        agentLabel.style.color = 'var(--text-muted)';
      }
    }

    // Auto-select role if URL has ?role=AGENT
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('role') === 'AGENT') {
        const agentRadio = document.querySelector('input[value="AGENT"]');
        if (agentRadio) {
          agentRadio.checked = true;
          toggleAgentFields('AGENT');
        }
      }
    });

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-submit-btn');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Registering Account...';
      btn.disabled = true;

      try {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const phone = document.getElementById('reg-phone').value;
        const role = document.querySelector('input[name="account-role"]:checked').value;
        const agency = document.getElementById('reg-agency').value;

        const res = await ApiService.register({
          name,
          email,
          password,
          phone,
          role,
          agency: role === 'AGENT' ? agency : undefined
        });

        Auth.setToken(res.data.token);
        Auth.setUser(res.data.user);

        Utils.showToast('Account registered successfully!', 'success');

        setTimeout(() => {
          if (res.data.user.role === 'ADMIN') {
            window.location.href = '/admin/dashboard.html';
          } else if (res.data.user.role === 'AGENT') {
            window.location.href = '/agent/dashboard.html';
          } else {
            window.location.href = '/index.html';
          }
        }, 600);
      } catch (err) {
        Utils.showToast(err.message || 'Registration failed', 'error');
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
