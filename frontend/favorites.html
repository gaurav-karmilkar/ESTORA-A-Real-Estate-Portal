<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Properties | ESTORA Luxury Real Estate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ballet&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/theme.js"></script>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="container-fluid nav-container">
      <a href="/index.html" class="nav-brand">
        <span class="logo-icon"><i class="fa-solid fa-gem"></i></span>
        ESTORA
      </a>

      <ul class="nav-menu">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/properties.html" class="nav-link">Properties</a></li>
        <li><a href="/agents.html" class="nav-link">Agents</a></li>
      </ul>

      <div class="nav-actions">
        <div id="nav-user-actions"></div>
      </div>
    </div>
  </nav>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-user-card">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" alt="Avatar" id="sidebar-user-avatar" class="sidebar-avatar">
        <div>
          <div class="sidebar-user-name" id="sidebar-user-name">User Name</div>
          <div class="sidebar-user-role" id="sidebar-user-role">MEMBER</div>
        </div>
      </div>

      <ul class="sidebar-nav">
        <li>
          <a href="/dashboard.html" class="sidebar-link">
            <i class="fa-solid fa-user-gear"></i> Profile & Settings
          </a>
        </li>
        <li>
          <a href="/favorites.html" class="sidebar-link active">
            <i class="fa-solid fa-heart"></i> Saved Properties
          </a>
        </li>
        <li>
          <a href="/inquiries.html" class="sidebar-link">
            <i class="fa-solid fa-envelope-open-text"></i> My Inquiries
          </a>
        </li>
        <li style="margin-top:auto;">
          <a href="javascript:void(0)" onclick="Auth.logout()" class="sidebar-link" style="color:var(--danger);">
            <i class="fa-solid fa-right-from-bracket"></i> Sign Out
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <div class="dash-header">
        <div>
          <h1 class="dash-title">Saved <span class="script-accent">Properties</span></h1>
          <p class="dash-subtitle">Your private collection of bookmarked luxury residences and estates</p>
        </div>
        <div>
          <a href="/properties.html" class="btn btn-outline btn-sm">
            <i class="fa-solid fa-compass"></i> Discover More
          </a>
        </div>
      </div>

      <div class="property-grid" id="favorites-grid">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/favorites.js"></script>
  <script src="/js/properties.js"></script>
  <script>
    async function loadSavedProperties() {
      const user = Auth.requireAuth();
      if (!user) return;

      const grid = document.getElementById('favorites-grid');
      const favIds = Favorites.getFavorites();

      if (favIds.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1;" class="empty-state">
            <i class="fa-regular fa-heart empty-state-icon"></i>
            <h3 class="empty-state-title">No Saved Properties</h3>
            <p class="empty-state-desc">Click the heart icon on any property card or detail page to bookmark it here.</p>
            <a href="/properties.html" class="btn btn-primary" style="margin-top:1rem;">Browse Collection</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = Properties.renderSkeletons(favIds.length);

      try {
        const promises = favIds.map(id => ApiService.getPropertyById(id).catch(() => null));
        const results = await Promise.all(promises);
        const properties = results.filter(r => r && r.data).map(r => r.data);

        if (properties.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1;" class="empty-state">
              <h3 class="empty-state-title">No Active Properties Found</h3>
            </div>
          `;
          return;
        }

        grid.innerHTML = properties.map(p => Properties.renderCard(p)).join('');
        Favorites.updateButtonsUI();
      } catch (err) {
        grid.innerHTML = '<div style="grid-column: 1 / -1; color:var(--danger);">Error loading saved properties.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSavedProperties();
    });
  </script>
</body>
</html>
